name: Claude Queue

on:
  push:
    branches:
      - claude-queue
    paths:
      - .passio/claude-task.md

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Contrôle d'authentification (subscription-only)
        id: auth
        uses: ./.github/actions/claude-auth-guard
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          policy: subscription-only

      - name: Run Claude Code task
        id: claude
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f # v1.0.198
        with:
          # Abonnement Claude Pro. `anthropic_api_key` est volontairement ABSENT.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Execute the trusted PASSIO task written in `.passio/claude-task.md`.
            Read `AGENTS.md` and `CLAUDE.md` first and obey all repository invariants.
            Make the smallest safe implementation that satisfies the task.
            Do not edit `.passio/claude-task.md`.
            Run the relevant checks for the files you touch.
            Commit and push your implementation to the current `claude-queue` branch.
            Never push to `main` and never deploy directly.
          additional_permissions: |
            actions: read
          # Liste ÉNUMÉRÉE, même raison que dans claude-code.yml : sans
          # --allowedTools, chaque appel Bash est refusé en CI (mesuré le
          # 2026-08-21, run 32460994611 : 16 refus, aucun commit, et pourtant
          # `success`). Le push n'est autorisé que vers `claude-queue`, la
          # branche de ce canal : `main` est hors d'atteinte par construction.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git fetch:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin claude-queue:*),Bash(git push -u origin claude-queue:*),Bash(node scripts/:*),Bash(npm run:*),Bash(npm test:*)"
            --append-system-prompt "You are the implementation agent for PASSIO. GitHub is the source of truth. Work only on the current task branch. Your tool grants are enumerated, not general: run one command per call, never chained with && or prefixed with cd, or the call is denied. Push only with: git push origin claude-queue"
