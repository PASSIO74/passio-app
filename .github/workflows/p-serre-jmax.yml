name: banc-cc p-serre-jmax
on:
  pull_request:
    types: [opened, edited, labeled]
  pull_request_review_comment:
    types: [created, edited]
jobs:
  agent:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'PASSIO74' &&
        (
          github.event.label.name == 'banc-label-ordre' ||
          (
            github.event.action == 'opened' &&
            (
              contains(github.event.pull_request.body, 'ORDRE-BANC') ||
              contains(github.event.pull_request.title, 'ORDRE-BANC')
            )
          ) ||
          (
            github.event.action == 'edited' &&
            (
              (
                github.event.changes.body &&
                contains(github.event.pull_request.body, 'ORDRE-BANC') &&
                !contains(github.event.changes.body.from, 'ORDRE-BANC')
              ) ||
              (
                github.event.changes.title &&
                contains(github.event.pull_request.title, 'ORDRE-BANC') &&
                !contains(github.event.changes.title.from, 'ORDRE-BANC')
              )
            )
          )
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login == 'PASSIO74' &&
        github.event.pull_request.user.login == 'PASSIO74' &&
        contains(github.event.comment.body, 'ORDRE-BANC') &&
        (
          github.event.action == 'created' ||
          (
            github.event.changes.body &&
            !contains(github.event.changes.body.from, 'ORDRE-BANC')
          )
        )
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'PASSIO74' &&
        github.event.pull_request.user.login == 'PASSIO74' &&
        contains(github.event.comment.body, 'ORDRE-BANC') &&
        (
          github.event.action == 'created' ||
          (
            github.event.changes.body &&
            !contains(github.event.changes.body.from, 'ORDRE-BANC')
          )
        )
      )
    concurrency:
      group: banc-cc-p-serre-jmax-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sleep 30
