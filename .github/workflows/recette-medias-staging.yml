name: Recette manuelle médias staging
on:
  workflow_dispatch:
    inputs:
      fenetre:
        description: "Le mainteneur est connecté au cockpit staging de la PR 970 et supervisera l’ouverture et la fermeture."
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read

jobs:
  recette:
    if: github.repository == 'PASSIO74/passio-app' && github.ref == 'refs/heads/main' && github.actor == 'PASSIO74' && github.run_attempt == 1 && inputs.fenetre
    runs-on: ubuntu-latest
    concurrency:
      group: passio-e2e-prod
      cancel-in-progress: false
      queue: max
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.5'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 44303549239
          artifact-ids: '14426923406'
          merge-multiple: true
          path: artefact-recette-969
      - name: Deux navigateurs sur serveur simulé
        run: node scripts/recette-medias/simulation.mjs artefact-recette-969
      - name: Parcours supervisé du propriétaire et du destinataire
        env:
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: node scripts/recette-medias/lancer.mjs --fenetre-supervisee
