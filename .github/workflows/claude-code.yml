name: Claude Code

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]

jobs:
  claude:
    if: >-
      github.actor == 'PASSIO74' &&
      (
        contains(github.event.issue.title || '', '@claude') ||
        contains(github.event.issue.body || '', '@claude') ||
        contains(github.event.comment.body || '', '@claude')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          branch_prefix: 'claude/'
          additional_permissions: |
            actions: read
          custom_instructions: |
            Read AGENTS.md and CLAUDE.md before changing PASSIO.
            Never push directly to main. Work on a Claude branch and create or update a pull request.
            Keep the change tightly scoped to the user request. Run relevant checks before finishing.
