# ═══════════════════════════════════════════════════════════════════════════
# VEILLE DE PRODUCTION — voir les pannes SILENCIEUSES et les dire UNE fois
#
# La sentinelle autonome ne voit que ce qui lève une erreur JavaScript. Mesuré
# du 09-11 au 09-18 : une journée à 310 lignes et 0 compte identifié, des
# inscriptions jamais confirmées, des crons servis 4 à 23 fois moins souvent
# qu'annoncé, 8 rouges sur main rattrapés uniquement parce que Benjamin était
# devant l'écran — aucun automate n'a rien dit. Ce workflow joue
# `scripts/veille-production.mjs` (lectures en LECTURE SEULE, verdict PUR) et :
#   · si ≥ 1 signal est en ALERTE, ouvre (ou met à jour) UNE issue `[VEILLE]`,
#     label `veille`, SANS le label `claude` — chaque alerte porte le geste
#     humain à faire, rien n'est auto-corrigé ;
#   · quand plus rien n'est en alerte, referme l'issue qu'il avait ouverte ;
#   · les signaux `warn` seuls n'ouvrent PAS d'issue : ils vont dans le résumé
#     du run et dans le digest du matin (digest.yml).
# GitHub envoie un e-mail au propriétaire pour toute issue : c'est le canal.
#
# ⚠️ Rien de nominatif ne sort : le dépôt est PUBLIC. Comptages et libellés
# d'endpoints seulement ; les requêtes SQL ne rendent que des agrégats.
# ⚠️ L'API de gestion Supabase (SUPABASE_ACCESS_TOKEN) n'exécute que du SELECT :
# le script REFUSE toute autre forme avant de l'envoyer (ADR-012 : pas de DDL
# ni de DML depuis la CI). La clé anon de production est PUBLIQUE (elle est dans
# le JavaScript livré) : elle est lue dans le dépôt, jamais recopiée ici.
# ⚠️ Le `GITHUB_TOKEN` intégré suffit pour l'issue : elle ne doit déclencher
# aucun autre workflow (règle anti-boucle), contrairement à la sentinelle.
# ⚠️ UN CRON GITHUB EST UNE DEMANDE, PAS UNE GARANTIE : mesuré, « toutes les
# 30 min » sera servi toutes les 2 à 5 h. Les seuils du script le tolèrent
# (silence ≥ 4 h, crons ≥ 6-30 h, déploiement ≥ 90 min) ; ne pas les resserrer
# sans mesurer d'abord. La veille ne se surveille pas elle-même : c'est le
# Centre de pilotage (poste) qui lit l'âge de son dernier run.
# ═══════════════════════════════════════════════════════════════════════════
name: Veille de production

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/veille-production.yml"
      - "scripts/veille-production.mjs"
      - "tests/unit/veille-production.test.mjs"

concurrency:
  group: veille-production
  cancel-in-progress: false

# `actions: read` : sans elle, toute portée non listée vaut `none` et les
# lectures de runs/workflows par github.token répondent 403 « Resource not
# accessible by integration » — les signaux `deploiement` et `crons` seraient
# muets à chaque passage (constat B-01). Lecture seule, sans effet sur
# l'anti-boucle.
permissions:
  contents: read
  issues: write
  actions: read

jobs:
  veiller:
    name: Lire la production et rendre un verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - name: Setup Node
        uses: actions/setup-node@v5
        with: { node-version: '22' }

      # Sur une PR qui touche ce canal : on éprouve les fonctions pures, rien d'autre.
      - name: Verrous unitaires
        run: node --test tests/unit/veille-production.test.mjs

      # La clé anon de production est publique et vit dans js/app-08 : on la lit
      # là où elle est plutôt que d'en tenir une copie qui divergerait.
      - name: Clé anon de production (lue dans le dépôt)
        if: github.event_name != 'pull_request'
        id: anon
        run: |
          set -euo pipefail
          cle="$(node -e '
            const s = require("fs").readFileSync("js/app-08-ui-modals-tour.js", "utf8");
            const m = s.match(/"(eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)"/);
            if (!m) { console.error("clé anon introuvable dans js/app-08-ui-modals-tour.js"); process.exit(1); }
            console.log(m[1]);
          ')"
          echo "::add-mask::${cle}"
          echo "cle=${cle}" >> "${GITHUB_OUTPUT}"

      - name: Verdict
        if: github.event_name != 'pull_request'
        id: verdict
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://njkiyoklssvefstljemx.supabase.co' }}
          SUPABASE_PROJECT_REF: njkiyoklssvefstljemx
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ANON_KEY: ${{ steps.anon.outputs.cle }}
          SENTINELLE_TOKEN: ${{ secrets.SENTINELLE_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PASSIO_PROD_URL: https://passio-app.netlify.app
        run: |
          set -uo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN absent::Sans le jeton de l'API de gestion, aucune mesure SQL n'est possible : la veille est AVEUGLE. Settings > Secrets and variables > Actions."
            exit 1
          fi
          # ⚠️ Shell par défaut `bash -e {0}` : écrit `node …; code=$?`, la PREMIÈRE alerte réelle (code 3) aurait tué
          # l'étape et ouvert [VEILLE MUETTE] au lieu de [VEILLE] — le même défaut que le digest au premier dispatch
          # (run 35350876138, 2026-09-18). La forme `|| code=$?` survit à -e.
          code=0; node scripts/veille-production.mjs --json > /tmp/verdict.json || code=$?
          # 0 = rien en alerte, 3 = alerte, autre = panne du lecteur (et une panne se voit).
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then cat /tmp/verdict.json; exit "$code"; fi
          echo "alerte=$([ "$code" -eq 3 ] && echo oui || echo non)" >> "${GITHUB_OUTPUT}"
          set -e
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("/tmp/verdict.json", "utf8"));
            fs.writeFileSync("/tmp/titre.txt", v.titre);
            fs.writeFileSync("/tmp/corps.md", v.corps + "\n\n_Dernier passage : " + new Date().toISOString() + "_\n");
            fs.writeFileSync("/tmp/resume.md", "## Veille de production\n\n" + v.resume.split("\n").map((l) => "- " + l).join("\n") + "\n");
          '
          cat /tmp/resume.md >> "${GITHUB_STEP_SUMMARY}"
          cat /tmp/resume.md

      # Le tableau (lot F) : UNE issue permanente `[TABLEAU] Veille de production`, label
      # `tableau` SEUL (jamais `claude`), dont le corps est RÉÉCRIT à chaque passage, alerte
      # ou non — éditer un corps d'issue n'envoie AUCUNE notification — et que le centre de
      # pilotage lit (Benjamin ne lit pas ses mails). Par LABEL puis titre filtré localement,
      # jamais `--search` (index en retard, #316). Un tableau non écrit n'est pas une veille
      # muette : `continue-on-error`, les étapes suivantes tournent.
      - name: Tableau
        if: github.event_name != 'pull_request' && steps.verdict.conclusion == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTE: ${{ steps.verdict.outputs.alerte }}
        run: |
          set -euo pipefail
          # Sous continue-on-error, un échec ici laisse le run vert : il doit quand même se VOIR (annotation + résumé).
          trap 'echo "::warning title=Tableau non écrit::[TABLEAU] Veille de production non réécrit : gh, label ou API en échec ; le pilotage lit encore le tableau précédent" ; echo "Tableau NON écrit (voir l annotation)" >> "${GITHUB_STEP_SUMMARY}"' ERR
          gh label create tableau --repo "${GITHUB_REPOSITORY}" --force --color "0E8A16" \
            --description "Compte rendu réécrit à chaque passage, lu par le centre de pilotage ; jamais notifié" >/dev/null 2>&1 || true
          # Le corps est écrit dans un fichier puis passé par --body-file : rien n'est interpolé dans une commande.
          {
            echo "<!-- tableau:veille v1 -->"
            echo "Mis à jour : $(date -u +%FT%TZ)"
            echo "Run : https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Alerte : ${ALERTE}"
            echo
            # Les lignes de /tmp/resume.md sans l'en-tête ni le préfixe « - » : `[ok] cle — texte`.
            sed -nE 's/^- //p' /tmp/resume.md
          } > /tmp/tableau.md
          existante="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label tableau --json number,title \
                        --jq '[.[] | select(.title | startswith("[TABLEAU] Veille de production"))] | .[0].number // empty')"
          if [ -n "${existante}" ]; then
            gh issue edit "${existante}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/tableau.md
            echo "Tableau mis à jour : #${existante}" >> "${GITHUB_STEP_SUMMARY}"
          else
            numero="$(gh issue create --repo "${GITHUB_REPOSITORY}" --title "[TABLEAU] Veille de production" \
                       --body-file /tmp/tableau.md --label tableau | grep -oE '[0-9]+$')"
            echo "Tableau créé : #${numero}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Ouvrir ou mettre à jour l'issue
        if: github.event_name != 'pull_request' && steps.verdict.outputs.alerte == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create veille --repo "${GITHUB_REPOSITORY}" \
            --description "Veille de production : un signal silencieux est en alerte (geste humain)" \
            --color "B91C1C" --force >/dev/null 2>&1 || true
          # Par LABEL, jamais par `--search in:title` : l'index de recherche de
          # GitHub retarde de plusieurs heures (mesuré sur la sentinelle, #316).
          existante="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label veille \
                        --json number --jq '.[0].number // empty')"
          if [ -n "${existante}" ]; then
            gh issue edit "${existante}" --repo "${GITHUB_REPOSITORY}" --title "$(cat /tmp/titre.txt)" --body-file /tmp/corps.md
            echo "Issue mise à jour : #${existante}" >> "${GITHUB_STEP_SUMMARY}"
          else
            numero="$(gh issue create --repo "${GITHUB_REPOSITORY}" --title "$(cat /tmp/titre.txt)" \
                       --body-file /tmp/corps.md --label veille | grep -oE '[0-9]+$')"
            echo "Issue ouverte : #${numero}" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Refermer l'issue si plus rien n'est en alerte
        if: github.event_name != 'pull_request' && steps.verdict.outputs.alerte == 'non'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label veille --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${GITHUB_REPOSITORY}" --reason completed \
              --comment "Plus aucun signal en alerte au passage du $(date -u +%FT%TZ). Refermée automatiquement."
            echo "Issue refermée : #${n}" >> "${GITHUB_STEP_SUMMARY}"
          done

      # La veille a parlé (alerte ou non) : une éventuelle issue « MUETTE » se referme.
      - name: Refermer « VEILLE MUETTE » puisqu'un verdict est rendu
        if: github.event_name != 'pull_request' && steps.verdict.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label veille-muette --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${GITHUB_REPOSITORY}" --reason completed \
              --comment "La veille a de nouveau rendu un verdict au passage du $(date -u +%FT%TZ). Refermée automatiquement."
            echo "Issue VEILLE MUETTE refermée : #${n}" >> "${GITHUB_STEP_SUMMARY}"
          done

      # ⚠️ UNE VEILLE QUI NE PARLE PLUS RESSEMBLE À UNE PRODUCTION SAINE. Si une
      # étape ci-dessus a échoué (jeton refusé, API de gestion en panne, script
      # cassé), on le dit par une issue `[VEILLE MUETTE]` — label `veille-muette`
      # SEUL, jamais `claude`, et PAS `disponibilite` : disponibilite.yml referme
      # « la première issue ouverte » de ce label dès que le site répond, avec
      # un commentaire hors sujet (constat B-05). Le digest connaît
      # `veille-muette` (LABELS_HUMAINS) et porte le geste. Refermée au
      # prochain run vert.
      - name: Issue « VEILLE MUETTE » si le run a échoué
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create veille-muette --repo "${GITHUB_REPOSITORY}" --color "B60205" --description "La veille de production n'a pas pu rendre de verdict" --force >/dev/null 2>&1 || true
          {
            echo "La veille de production n'a pas pu rendre de verdict : une de ses étapes a échoué."
            echo
            echo "- Run : ${run_url}"
            echo "- Causes fréquentes : SUPABASE_ACCESS_TOKEN ou SENTINELLE_TOKEN expiré (Settings > Secrets), API de gestion Supabase indisponible, script cassé par une PR."
            echo "- Tant qu'elle est muette, les pannes silencieuses (télémétrie arrêtée, inscriptions non confirmées, déploiement bloqué, crons morts) ne sont vues par personne."
            echo
            echo "Cette issue se referme d'elle-même au prochain passage qui rend un verdict."
          } > /tmp/muette.md
          existante="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label veille-muette --json number --jq '.[0].number // empty')"
          if [ -n "${existante}" ]; then
            gh issue comment "${existante}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/muette.md
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "[VEILLE MUETTE] la veille de production n'a pas rendu de verdict" \
              --label veille-muette --body-file /tmp/muette.md
          fi
