name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

# ⚠️ UN SEUL RUN A LA FOIS, TOUTES BRANCHES CONFONDUES. Ajouté le 2026-08-30,
# après un incident mesuré.
#
# CE QUI S'EST PASSÉ. Huit branches mises à jour puis six PR fusionnées coup sur
# coup ont lancé quatorze runs en une heure. Or les gardes de sécurité de cette
# suite — `authz-critical.spec.js` et `user-state-horodatage.spec.js` — créent de
# VRAIS comptes sur la prod Supabase : c'est ce qui leur donne leur valeur (elles
# éprouvent la vraie RLS, pas la politesse du client), mais cela consomme le quota
# d'inscriptions du projet, qui est partagé et horaire.
#
# Symptôme, constant sur trois retries : `signUp` rend un utilisateur SANS session
# et SANS message d'erreur — donc « pas de session ». Le gate d'autorisation
# passait encore à 05:22 et échouait à 06:03. Ce n'était ni un flake, ni une
# régression du code : le quota s'était épuisé entre les deux, et main est resté
# rouge avec le déploiement production sauté.
#
# POURQUOI CETTE FORME. Le groupe est CONSTANT (pas dérivé de `github.ref`) :
# c'est ce qui borne le nombre total de runs simultanés, et donc d'inscriptions
# par heure. Un groupe par branche n'aurait rien réglé — la saturation vient du
# CUMUL entre branches.
#
# `cancel-in-progress: false` est délibéré : annuler un run en cours pourrait
# interrompre un déploiement à mi-chemin. En sérialisant, le dernier commit
# poussé est aussi le dernier déployé — ce qui ferme au passage le défaut d'un
# run ancien finissant après un plus récent et remettant en ligne un artefact
# périmé.
#
# ⚠️ DEUX GROUPES, ET C'EST LA CORRECTION D'UN DÉFAUT MESURÉ (2026-08-30, audit
# de la PR #222). La première version posait UN groupe constant couvrant les deux
# déclencheurs, et son commentaire affirmait qu'un run en attente n'était remplacé
# que par « un nouveau push sur la même PR ». C'est FAUX : GitHub ne garde qu'UN
# emplacement en attente par groupe, et tout nouveau run entrant y évince celui
# qui patientait, quelle que soit son origine. Conséquence, sur ce dépôt où huit
# branches vivent en parallèle : une fusion sur main met son run de déploiement
# en attente, la mise à jour d'une PR quelconque l'ANNULE, et le commit fusionné
# n'est JAMAIS déployé — sans un job rouge, sans une alerte, exactement la panne
# silencieuse que cette PR existe pour réparer.
#
# Les pushes sur main ont donc leur propre groupe : ils se sérialisent entre eux
# et aucune PR ne peut les évincer. Les PR gardent le groupe commun, qui borne le
# cumul de runs simultanés — la raison d'être initiale.
#
# ⚠️ TROISIÈME CORRECTION (2026-09-01) — LE PLAFOND ÉTAIT AU MAUVAIS ÉTAGE.
# Les deux groupes ci-dessus se sérialisent CHACUN DE LEUR CÔTÉ : rien n'empêchait
# un run de `main` et un run de PR de s'exécuter EN MÊME TEMPS. Mesuré ce jour-là :
# le run de la PR #235 (13h41 → 15h15) et celui de `main` après la fusion de la
# PR #233 (14h50 → 15h21) se sont chevauchés 25 minutes. Les deux suites créent de
# vrais comptes sur la MÊME prod Supabase, et `global-teardown` purge TOUS les
# comptes `%@passio-e2e.test` : chacune a effacé les comptes de l'autre. Six tests
# rouges des deux côtés, `main` resté rouge, déploiement production SAUTÉ — et le
# symptôme ne désignait rien : un test de lien profond attendait la bobine de
# démonstration et recevait une bobine générée par un compte de test étranger.
#
# La ressource réellement partagée n'est pas « le workflow », c'est LA BASE DE
# PRODUCTION — et un seul job la touche. Le verrou descend donc au niveau du job
# `test` (groupe `passio-e2e-prod`, plus bas), où il couvre les deux déclencheurs
# d'un coup. C'est aussi lui qui borne désormais le quota d'inscriptions horaire,
# puisque c'est ce job, et lui seul, qui inscrit des comptes.
#
# Conséquence voulue : le groupe des PR peut redevenir PROPRE À CHAQUE PR. Il était
# commun pour borner le cumul de runs simultanés — ce que le verrou de job fait
# mieux, et sans son coût, qui était réel (une PR en attente évincée par une AUTRE
# PR, qu'il fallait repousser à la main pour relancer ; c'est arrivé deux fois le
# 2026-09-01). Les pushes sur `main` gardent leur groupe dédié : c'est lui qui
# empêche une PR d'évincer un déploiement, le défaut réparé le 2026-08-30, et il
# n'est pas touché.
concurrency:
  group: ${{ github.event_name == 'push' && 'passio-deploy-main' || format('passio-ci-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Gouvernance critique
    runs-on: ubuntu-latest
    steps:
      - name: Résoudre la PR et vérifier la contre-revue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          TRUSTED_REVIEWER: PASSIO74
        run: |
          set -euo pipefail

          pr="${EVENT_PR}"
          if [ "${EVENT_NAME}" = "push" ]; then
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')"
            if [ -z "${pr}" ]; then
              echo "::error title=Push direct sur main::Aucune pull request n'est associée à ${GITHUB_SHA}. Le déploiement production est refusé."
              exit 1
            fi
          fi

          files="$(gh pr diff "${pr}" --repo "${GITHUB_REPOSITORY}" --name-only)"
          critical=false
          while IFS= read -r file; do
            case "${file}" in
              .github/*|migrations/*|dashboard/server/auth.js|dashboard/server/config.js|dashboard/server/repair.js|dashboard/server/sentinel.js|scripts/run_migrations.js|scripts/sauvegarde-donnees.js)
                critical=true ;;
            esac
          done <<< "${files}"

          {
            echo "## Gouvernance"
            echo
            echo "- PR : #${pr}"
            echo "- Changement critique : ${critical}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${critical}" != "true" ]; then
            exit 0
          fi

          head_sha="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
          reviews="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews")"
          if ! jq -e --arg reviewer "${TRUSTED_REVIEWER}" --arg head "${head_sha}" '
            [.[] | select(
              .user.login == $reviewer
              and .commit_id == $head
              and ((.body // "") | contains("Contre-revue technique indépendante"))
            )] | length > 0
          ' <<< "${reviews}" >/dev/null; then
            echo "::error title=Contre-revue manquante::Cette PR touche un périmètre critique. Une revue GitHub par PASSIO74, ancrée sur le SHA courant et contenant le marqueur « Contre-revue technique indépendante », est obligatoire avant preview ou production."
            exit 1
          fi

          echo "- Contre-revue indépendante : présente sur ${head_sha}" >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Tests smoke (Playwright)
    runs-on: ubuntu-latest
    # ⚠️ LE VERROU DE LA PROD SUPABASE, ET IL EST GLOBAL AU DÉPÔT (2026-09-01).
    # Ce job — et lui seul — crée de vrais comptes sur la prod, et son
    # `global-teardown` purge TOUS les comptes `%@passio-e2e.test`. Deux
    # exécutions simultanées s'effacent donc mutuellement leurs comptes, quelle
    # que soit la branche : c'est ce qui a laissé `main` rouge et le déploiement
    # sauté le 2026-09-01 (voir la note du bloc `concurrency` en tête de fichier).
    #
    # Le groupe est CONSTANT — ni la branche, ni le déclencheur n'y entrent : c'est
    # exactement ce qui fait qu'un run de PR et un run de `main` ne peuvent plus se
    # chevaucher. C'est aussi ce qui borne le quota d'inscriptions horaire du projet
    # Supabase, la raison d'être du plafond posé le 2026-08-30.
    #
    # `cancel-in-progress: false` : une suite en cours a déjà créé des comptes que
    # son teardown doit nettoyer. L'interrompre les laisserait derrière elle.
    concurrency:
      group: passio-e2e-prod
      cancel-in-progress: false
    # Les suites qui ecrivent en base (authz-critical, blocage-acces,
    # user-state-horodatage) creent des comptes jetables. Depuis l'activation de
    # « Confirm email » (SMTP Brevo, 2026-08-30), signUp ne rend plus de session :
    # ces comptes doivent etre crees PRE-CONFIRMES par l'API d'administration,
    # donc avec la cle service_role. Sans ce secret, tests/e2e/compte-e2e.js
    # echoue en nommant la cause plutot que de se mettre en veille silencieuse
    # sur une barriere de securite.
    #
    # ⚠️ LE SECRET EST PORTÉ PAR LES DEUX SEULES ÉTAPES QUI S'EN SERVENT, JAMAIS
    # PAR LE JOB. Corrigé le 2026-08-30 (audit de la PR #222) : posé au niveau du
    # job, il était dans l'environnement de TOUTES les étapes, dont trois qui
    # exécutent du code de tiers non épinglé (`npm install` du dashboard, `npm
    # install --no-save @playwright/test`, `npx playwright install`). Un seul
    # `postinstall` d'une dépendance transitive compromise suffisait alors à lire
    # `process.env.SUPABASE_SERVICE_ROLE_KEY` et à l'exfiltrer, job vert et sans
    # trace — or cette clé contourne INTÉGRALEMENT la RLS de la prod.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Audits statiques (collisions de globals)
        run: node scripts/audit-globals.js

      - name: Audits statiques (handlers inline fantômes)
        run: node scripts/audit-handlers.js

      # Échoue si une donnée atteint un src/href, un on* ou un style SANS le
      # désinfectant du contexte, et hors du socle relu (scripts/echappement-socle.json).
      - name: Audits statiques (échappement contextuel)
        run: node scripts/audit-echappement.js --ci

      # Un test qui n'exécute jamais le code de production ne garde rien — et il
      # ne se signale jamais tout seul. Vécu le 2026-08-16 : un spec recopiait
      # les deux lignes du correctif qu'il était censé garder.
      - name: Audits statiques (tests creux)
        run: node scripts/audit-tests-creux.js --ci

      # Le SDK Supabase vient d'un CDN : tant qu'il n'est pas là, TOUT passe par
      # le stub noop d'app-08. Un membre appelé par l'app et absent du stub ne se
      # voit qu'hors ligne, en TypeError non rattrapé — donc là où le stub devait
      # protéger. Mesuré le 2026-08-22 : .not/.or/.update/storage/functions.
      - name: Audits statiques (stub Supabase hors ligne)
        run: node scripts/audit-supa-stub.js

      # Le filtre PII de telemetry.js est une liste NOIRE : une cle qui la percute
      # n'est pas signalee, elle est SILENCIEUSEMENT jetee. L'evenement part, sa
      # charge utile n'arrive jamais, et un test qui stubbe tel.track reste vert.
      # Mesure le 2026-08-22 : « passion_ctx » (#9) et « passion » (idb-store)
      # percutaient « pass ». Le premier etait deja en production.
      - name: Audits statiques (cles de telemetrie vs filtre PII)
        run: node scripts/audit-telemetry-keys.js

      # Referentiel plat des passions (lot flat_passions_v1).
      # Deux controles, et le second est le plus important : le JSON servi au
      # navigateur et la migration SQL sont GENERES depuis data/passions/*.js.
      # Modifier la source sans regenerer laisserait les deux decrire un
      # referentiel qui n'existe plus, et personne ne le verrait avant la prod.
      - name: Referentiel des passions (validation + miroirs a jour)
        run: |
          node scripts/valider-referentiel-passions.js
          node scripts/construire-referentiel-passions.js --verifier

      # Le banc des frontieres de confiance du canal Claude Code. Il verifie
      # mecaniquement que les garde-fous sont intacts : Claude sans droit de
      # push, action epinglee au SHA, allowed_bots jamais « * », cible ET
      # instruction de PASSIO74, chemins de controle hors d'atteinte, aucun
      # motif d'allowlist mort-ne, politique de modeles.
      #
      # Il existait depuis ce matin avec 76 assertions eprouvees par mutation,
      # et n'etait lance NULLE PART : il ne protegeait donc rien. Une PR qui
      # affaiblissait un garde-fou passait au vert. C'est corrige ici : toute
      # regression sur une frontiere rend la CI rouge, sans que personne ait
      # a y penser.
      - name: Frontieres de confiance du canal Claude
        run: bash tests/ci/frontiere-confiance.sh

      # Banc #136 : les gardes Trust & Safety SERVEUR (age fiable, blocage
      # bidirectionnel, conversation non forcable) sont des policies RLS et des
      # fonctions SECURITY DEFINER. Aucun test Playwright ne peut les prouver :
      # ils vivent dans PostgreSQL, pas dans le navigateur.
      #
      # Le banc monte un PostgreSQL jetable, y reconstitue les policies REELLES
      # de prod, applique la migration et joue les scenarios en tant que comptes
      # distincts - puis retire chaque garde et exige que le test correspondant
      # redevienne rouge. Il ne touche aucune base reelle.
      #
      # Branche ici des sa creation : le depot a deja paye le fait qu'un banc
      # ecrit mais lance nulle part ne protege rien (cf. frontiere-confiance.sh
      # ci-dessus, qui a vecu une journee sans garder quoi que ce soit).
      - name: Banc Trust & Safety serveur (RLS, PostgreSQL jetable)
        run: bash tests/sql/migration-ts-serveur.test.sh

      # La migration du referentiel plat, EXECUTEE deux fois sur un PostgreSQL
      # jetable : idempotence, preservation des 19 identifiants historiques,
      # RLS en lecture seule sur le referentiel, et retour arriere.
      # Relire une migration ne prouve pas son idempotence — le lot precedent
      # en a livre une qui ne l'etait pas, trouvee en l'executant.
      - name: Migration du referentiel plat (PostgreSQL jetable)
        run: bash scripts/verifier-migration-passions.sh

      # Le centre de pilotage est une application à part entière. Ses tests
      # déterministes (Sentinel, Guardian, Autopilot, rollback) sont désormais
      # une gate CI explicite : une autonomie non testée ne doit jamais être verte.
      # `npm ci` et non `npm install` : `dashboard/package-lock.json` est versionné,
      # donc l'arbre installé doit être celui qu'il fixe. `npm install` laissait
      # l'arbre dériver vers des versions jamais relues.
      - name: Tests centre de pilotage / Sentinel
        working-directory: dashboard
        run: |
          npm ci
          npm test

      - name: Installer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      # Gate d'autorisation (incident CI-GATE-001) : lancé EN PREMIER et à part,
      # pour que la séparation entre comptes soit prouvée avant tout le reste et
      # qu'un rouge ici soit lisible immédiatement, sans le chercher dans 150
      # résultats. ⚠️ Nécessite désormais le secret SUPABASE_SERVICE_ROLE_KEY
      # (env du job) : la clé anon ne suffit plus depuis que la confirmation
      # d'e-mail est active.
      - name: Gate d'autorisation (AUTHZ-CRITICAL)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test tests/e2e/authz-critical.spec.js

      # Mesure de la dette de classement des passions. LECTURE SEULE (requêtes
      # HEAD de comptage), sortie strictement agrégée : aucun identifiant de
      # compte, aucun contenu, aucune donnée personnelle n'atteint ce journal.
      # `continue-on-error` est délibéré : c'est une mesure, pas une barrière —
      # un rouge ici ne dirait rien sur le code du commit.
      - name: Mesure `passion_id` (lecture seule, agrégats)
        continue-on-error: true
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/mesure-passions.js

      - name: Lancer les tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx playwright test

      # Le déploiement sert dist/, pas les fichiers de développement. Cette passe
      # reconstruit donc l'artefact réel et prouve que HTML, release.json, SW et
      # gardes navigateur portent la même identité de release. Elle vérifie aussi
      # le drain télémétrique et le contexte passionnel future-only réellement
      # concaténé dans le bundle de production.
      - name: Gates artefact production
        env:
          PASSIO_CIBLE: dist
          PASSIO_PORT: 8091
          COMMIT_REF: ${{ github.sha }}
        run: npx playwright test tests/e2e/release-integrity.spec.js tests/e2e/passion-context.spec.js

  deploy:
    name: Déploiement production
    if: github.event_name == 'push'
    needs: [test, governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Même runtime que les tests : un artefact validé sous Node 22 ne doit pas
      # être reconstruit sous une version implicite différente au déploiement.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build dist (assemblage monolithique + assets publics)
        env:
          COMMIT_REF: ${{ github.sha }}
        run: |
          node scripts/build.js dist/index.html
          # sw.js et release.json sont générés par build.js — ne pas les recopier
          cp manifest.json _headers icon-192.png icon-512.png dist/

      - name: Minify index.html (fallback sur le fichier brut en cas d'erreur)
        run: |
          npx --yes html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            -o dist/index.min.html dist/index.html \
          && mv dist/index.min.html dist/index.html \
          || echo "Minification échouée, déploiement du fichier brut"

      - name: Minify app.js (fallback sur le fichier brut en cas d'erreur)
        run: |
          npx --yes terser dist/app.js -o dist/app.min.js --compress --mangle \
          && mv dist/app.min.js dist/app.js \
          || echo "Minification app.js échouée, déploiement du fichier brut"

      - name: Minify styles.css (fallback sur le fichier brut en cas d'erreur)
        run: |
          npx --yes clean-css-cli -o dist/styles.min.css dist/styles.css \
          && mv dist/styles.min.css dist/styles.css \
          || echo "Minification styles.css échouée, déploiement du fichier brut"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: eee53fe0-9fb2-41f4-ab70-0a4e2c3f01a1
        run: |
          npx --yes netlify-cli@27.1.2 --version
          npx --yes netlify-cli@27.1.2 deploy --prod --dir dist --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"

  preview:
    name: Déploiement preview (PR)
    if: github.event_name == 'pull_request'
    needs: [test, governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build dist
        env:
          COMMIT_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/build.js dist/index.html
          # sw.js et release.json sont générés par build.js — ne pas les recopier
          cp manifest.json _headers icon-192.png icon-512.png dist/

      - name: Deploy preview Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: eee53fe0-9fb2-41f4-ab70-0a4e2c3f01a1
        run: |
          npx --yes netlify-cli@27.1.2 --version
          npx --yes netlify-cli@27.1.2 deploy --dir dist --alias "pr-${{ github.event.number }}" --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"
