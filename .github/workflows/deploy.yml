name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: Gouvernance critique
    runs-on: ubuntu-latest
    steps:
      - name: Résoudre la PR et vérifier la contre-revue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          TRUSTED_REVIEWER: PASSIO74
        run: |
          set -euo pipefail

          pr="${EVENT_PR}"
          if [ "${EVENT_NAME}" = "push" ]; then
            pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number // empty')"
            if [ -z "${pr}" ]; then
              echo "::error title=Push direct sur main::Aucune pull request n'est associée à ${GITHUB_SHA}. Le déploiement production est refusé."
              exit 1
            fi
          fi

          files="$(gh pr diff "${pr}" --repo "${GITHUB_REPOSITORY}" --name-only)"
          critical=false
          while IFS= read -r file; do
            case "${file}" in
              .github/*|migrations/*|dashboard/server/auth.js|dashboard/server/config.js|dashboard/server/repair.js|dashboard/server/sentinel.js|scripts/run_migrations.js|scripts/sauvegarde-donnees.js)
                critical=true ;;
            esac
          done <<< "${files}"

          {
            echo "## Gouvernance"
            echo
            echo "- PR : #${pr}"
            echo "- Changement critique : ${critical}"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${critical}" != "true" ]; then
            exit 0
          fi

          head_sha="$(gh pr view "${pr}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
          reviews="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/reviews")"
          if ! jq -e --arg reviewer "${TRUSTED_REVIEWER}" --arg head "${head_sha}" '
            [.[] | select(
              .user.login == $reviewer
              and .commit_id == $head
              and ((.body // "") | contains("Contre-revue technique indépendante"))
            )] | length > 0
          ' <<< "${reviews}" >/dev/null; then
            echo "::error title=Contre-revue manquante::Cette PR touche un périmètre critique. Une revue GitHub par PASSIO74, ancrée sur le SHA courant et contenant le marqueur « Contre-revue technique indépendante », est obligatoire avant preview ou production."
            exit 1
          fi

          echo "- Contre-revue indépendante : présente sur ${head_sha}" >> "${GITHUB_STEP_SUMMARY}"

  test:
    name: Tests smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Audits statiques (collisions de globals)
        run: node scripts/audit-globals.js

      - name: Audits statiques (handlers inline fantômes)
        run: node scripts/audit-handlers.js

      # Échoue si une donnée atteint un src/href, un on* ou un style SANS le
      # désinfectant du contexte, et hors du socle relu (scripts/echappement-socle.json).
      - name: Audits statiques (échappement contextuel)
        run: node scripts/audit-echappement.js --ci

      # Un test qui n'exécute jamais le code de production ne garde rien — et il
      # ne se signale jamais tout seul. Vécu le 2026-08-16 : un spec recopiait
      # les deux lignes du correctif qu'il était censé garder.
      - name: Audits statiques (tests creux)
        run: node scripts/audit-tests-creux.js --ci

      # Le SDK Supabase vient d'un CDN : tant qu'il n'est pas là, TOUT passe par
      # le stub noop d'app-08. Un membre appelé par l'app et absent du stub ne se
      # voit qu'hors ligne, en TypeError non rattrapé — donc là où le stub devait
      # protéger. Mesuré le 2026-08-22 : .not/.or/.update/storage/functions.
      - name: Audits statiques (stub Supabase hors ligne)
        run: node scripts/audit-supa-stub.js

      # Le filtre PII de telemetry.js est une liste NOIRE : une cle qui la percute
      # n'est pas signalee, elle est SILENCIEUSEMENT jetee. L'evenement part, sa
      # charge utile n'arrive jamais, et un test qui stubbe tel.track reste vert.
      # Mesure le 2026-08-22 : « passion_ctx » (#9) et « passion » (idb-store)
      # percutaient « pass ». Le premier etait deja en production.
      - name: Audits statiques (cles de telemetrie vs filtre PII)
        run: node scripts/audit-telemetry-keys.js

      # Le banc des frontieres de confiance du canal Claude Code. Il verifie
      # mecaniquement que les garde-fous sont intacts : Claude sans droit de
      # push, action epinglee au SHA, allowed_bots jamais « * », cible ET
      # instruction de PASSIO74, chemins de controle hors d'atteinte, aucun
      # motif d'allowlist mort-ne, politique de modeles.
      #
      # Il existait depuis ce matin avec 76 assertions eprouvees par mutation,
      # et n'etait lance NULLE PART : il ne protegeait donc rien. Une PR qui
      # affaiblissait un garde-fou passait au vert. C'est corrige ici : toute
      # regression sur une frontiere rend la CI rouge, sans que personne ait
      # a y penser.
      - name: Frontieres de confiance du canal Claude
        run: bash tests/ci/frontiere-confiance.sh

      # Banc #136 : les gardes Trust & Safety SERVEUR (age fiable, blocage
      # bidirectionnel, conversation non forcable) sont des policies RLS et des
      # fonctions SECURITY DEFINER. Aucun test Playwright ne peut les prouver :
      # ils vivent dans PostgreSQL, pas dans le navigateur.
      #
      # Le banc monte un PostgreSQL jetable, y reconstitue les policies REELLES
      # de prod, applique la migration et joue les scenarios en tant que comptes
      # distincts - puis retire chaque garde et exige que le test correspondant
      # redevienne rouge. Il ne touche aucune base reelle.
      #
      # Branche ici des sa creation : le depot a deja paye le fait qu'un banc
      # ecrit mais lance nulle part ne protege rien (cf. frontiere-confiance.sh
      # ci-dessus, qui a vecu une journee sans garder quoi que ce soit).
      - name: Banc Trust & Safety serveur (RLS, PostgreSQL jetable)
        run: bash tests/sql/migration-ts-serveur.test.sh

      # Le centre de pilotage est une application à part entière. Ses tests
      # déterministes (Sentinel, Guardian, Autopilot, rollback) sont désormais
      # une gate CI explicite : une autonomie non testée ne doit jamais être verte.
      - name: Tests centre de pilotage / Sentinel
        working-directory: dashboard
        run: |
          npm install
          npm test

      - name: Installer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      # Gate d'autorisation (incident CI-GATE-001) : lancé EN PREMIER et à part,
      # pour que la séparation entre comptes soit prouvée avant tout le reste et
      # qu'un rouge ici soit lisible immédiatement, sans le chercher dans 150
      # résultats. Ne nécessite aucun secret : l'inscription passe par la clé anon.
      - name: Gate d'autorisation (AUTHZ-CRITICAL)
        run: npx playwright test tests/e2e/authz-critical.spec.js

      - name: Lancer les tests
        run: npx playwright test

      # Le déploiement sert dist/, pas les fichiers de développement. Cette passe
      # reconstruit donc l'artefact réel et prouve que HTML, release.json, SW et
      # gardes navigateur portent la même identité de release. Elle vérifie aussi
      # le drain télémétrique et le contexte passionnel future-only réellement
      # concaténé dans le bundle de production.
      - name: Gates artefact production
        env:
          PASSIO_CIBLE: dist
          PASSIO_PORT: 8091
          COMMIT_REF: ${{ github.sha }}
        run: npx playwright test tests/e2e/release-integrity.spec.js tests/e2e/passion-context.spec.js

  deploy:
    name: Déploiement production
    if: github.event_name == 'push'
    needs: [test, governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Même runtime que les tests : un artefact validé sous Node 22 ne doit pas
      # être reconstruit sous une version implicite différente au déploiement.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build dist (assemblage monolithique + assets publics)
        env:
          COMMIT_REF: ${{ github.sha }}
        run: |
          node scripts/build.js dist/index.html
          # sw.js et release.json sont générés par build.js — ne pas les recopier
          cp manifest.json _headers icon-192.png icon-512.png dist/

      - name: Minify index.html (fallback sur le fichier brut en cas d'erreur)
        run: |
          npx --yes html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --minify-css true \
            --minify-js true \
            -o dist/index.min.html dist/index.html \
          && mv dist/index.min.html dist/index.html \
          || echo "Minification échouée, déploiement du fichier brut"

      - name: Minify app.js (fallback sur le fichier brut en cas d'erreur)
        run: |
          npx --yes terser dist/app.js -o dist/app.min.js --compress --mangle \
          && mv dist/app.min.js dist/app.js \
          || echo "Minification app.js échouée, déploiement du fichier brut"

      - name: Minify styles.css (fallback sur le fichier brut en cas d'erreur)
        run: |
          npx --yes clean-css-cli -o dist/styles.min.css dist/styles.css \
          && mv dist/styles.min.css dist/styles.css \
          || echo "Minification styles.css échouée, déploiement du fichier brut"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: eee53fe0-9fb2-41f4-ab70-0a4e2c3f01a1
        run: |
          npx --yes netlify-cli@27.1.2 --version
          npx --yes netlify-cli@27.1.2 deploy --prod --dir dist --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"

  preview:
    name: Déploiement preview (PR)
    if: github.event_name == 'pull_request'
    needs: [test, governance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build dist
        env:
          COMMIT_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/build.js dist/index.html
          # sw.js et release.json sont générés par build.js — ne pas les recopier
          cp manifest.json _headers icon-192.png icon-512.png dist/

      - name: Deploy preview Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: eee53fe0-9fb2-41f4-ab70-0a4e2c3f01a1
        run: |
          npx --yes netlify-cli@27.1.2 --version
          npx --yes netlify-cli@27.1.2 deploy --dir dist --alias "pr-${{ github.event.number }}" --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID"
