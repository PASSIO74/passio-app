name: Claude PR Task

on:
  pull_request:
    types: [opened]

jobs:
  claude:
    if: >-
      github.event.pull_request.user.login == 'PASSIO74' &&
      startsWith(github.event.pull_request.head.ref, 'claude-task/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run Claude Code directly with Opus only
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PASSIO }}
          ANTHROPIC_MODEL: opus
          CLAUDE_CODE_SUBAGENT_MODEL: opus
          DISABLE_TELEMETRY: '1'
          DISABLE_ERROR_REPORTING: '1'
          DISABLE_BUG_COMMAND: '1'
        run: |
          set -euo pipefail
          TASK="$(cat .passio/claude-task.md)"
          PROMPT=$(cat <<EOF
          You are the implementation agent for PASSIO.
          Read AGENTS.md and CLAUDE.md first and obey all repository invariants.
          Execute the trusted task below on the current PR branch.
          Use Claude Opus only for this task and all subagents. Never switch to Sonnet or Haiku.
          Make the smallest safe implementation that satisfies the task.
          Do not modify .passio/claude-task.md.
          Do not commit, push, merge, or switch branches; the workflow will persist only the file changes you create.
          Run relevant checks when possible.

          TASK:
          ${TASK}
          EOF
          )
          claude -p "$PROMPT" \
            --model opus \
            --max-turns 40 \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run:*),Bash(npm test:*),Bash(git diff:*),Bash(git status:*)" \
            --output-format text

      - name: Verify Claude produced an application diff
        run: |
          set -euo pipefail
          if ! git diff --quiet -- .passio/claude-task.md; then
            echo "Claude modified the task file; refusing to persist."
            exit 1
          fi

          CHANGED="$(git status --porcelain | awk '{print substr($0,4)}' | grep -v '^.passio/claude-task.md$' || true)"
          if [ -z "$CHANGED" ]; then
            echo "Claude produced no non-task file changes."
            exit 1
          fi

          echo "Claude-produced files:"
          printf '%s\n' "$CHANGED"
          git diff --check

      - name: Persist Claude-produced changes
        run: |
          set -euo pipefail
          git config user.name "claude[bot]"
          git config user.email "41898282+claude[bot]@users.noreply.github.com"
          git add -A
          git reset -- .passio/claude-task.md
          git commit -m "test: Claude Code Opus applies PR task"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
