# BANC TEMPORAIRE (2026-11-06), v2 — retiré avant la PR, résultats consignés dans
# docs/journal/telemetrie-pilotage-sentinelle.md. Ne tourne que sur la branche de
# travail, et seulement quand ce fichier change. Aucun secret, aucune écriture.
# La v1 (run 42196781730) a mesuré ce que GitHub fait d'une étape ou d'un job
# hors délai, la relance « Re-run failed jobs », et TROUVÉ LE DÉFAUT corrigé ici :
# `timeout` ne joint pas l'`apt-get` lancé par `sudo`, qui garde le verrou APT.
#   figee   : l'étape RÉELLE de test-local, premier essai figé dans APT (serveur
#             qui accepte la connexion et ne répond jamais) → coupé, survivants
#             achevés, second essai mené à bien ?
#   reprise : l'étape RÉELLE, premier essai sur un miroir ralenti à ~40 ko/s (le
#             régime du 06/11 : 34 ko/s) coupé en plein téléchargement → le second
#             repart-il de ce qu'APT a déjà téléchargé ?
# Dans les deux, la borne d'essai est ramenée de 10 à 2 min (seule réécriture).
name: Banc temporaire — bornes d'installation

on:
  push:
    branches:
      - claude/tender-wright-22wrvd
    paths:
      - .github/workflows/banc-bornes-installation.yml

permissions:
  contents: read

jobs:
  banc:
    strategy:
      fail-fast: false
      matrix:
        cas: [figee, reprise]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Extraire l'étape réelle de test-local (essai ramené de 10 à 2 min)
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { parse } from "./tests/unit/lib/yaml-mini.mjs";
            const w = parse(fs.readFileSync(".github/workflows/deploy.yml", "utf8"));
            const s = w.jobs["test-local"].steps.find((x) => x.name === "Installer Playwright");
            const banc = s.run.replace("timeout --kill-after=30s 10m ", "timeout --kill-after=30s 2m ");
            if (banc === s.run) { console.error("borne d essai introuvable"); process.exit(1); }
            fs.writeFileSync(process.env.RUNNER_TEMP + "/installer.sh", banc);
            console.log(banc);
          '

      - name: Piège APT figé (accepte, ne répond jamais), levé après 45 s
        if: matrix.cas == 'figee'
        run: |
          nohup node -e 'require("net").createServer(() => {}).listen(9999, "127.0.0.1")' >/dev/null 2>&1 &
          sleep 1
          printf '%s\n' 'Acquire::http::Proxy "http://127.0.0.1:9999";' 'Acquire::https::Proxy "http://127.0.0.1:9999";' 'Acquire::http::Timeout "3600";' 'Acquire::https::Timeout "3600";' | sudo tee /etc/apt/apt.conf.d/99-banc
          nohup bash -c 'sleep 45; sudo rm -f /etc/apt/apt.conf.d/99-banc' >/dev/null 2>&1 &

      - name: Miroir APT ralenti à ~40 ko/s, levé après 100 s (avant la coupure)
        if: matrix.cas == 'reprise'
        run: |
          sudo apt-get update -qq
          cat > "${RUNNER_TEMP}/lent.mjs" <<'JS'
          import http from "node:http";
          const [port, debit] = process.argv.slice(2).map(Number);
          const agent = new http.Agent({ keepAlive: true });
          http.createServer((req, res) => {
            let cible;
            try { cible = new URL(req.url); } catch { res.writeHead(400); res.end(); return; }
            const headers = { ...req.headers, host: cible.host };
            delete headers["proxy-connection"];
            const amont = http.request({ agent, host: cible.hostname, port: cible.port || 80, method: req.method,
              path: cible.pathname + cible.search, headers }, (r) => {
              res.writeHead(r.statusCode, r.headers);
              r.on("data", (c) => { r.pause(); res.write(c); setTimeout(() => r.resume(), Math.ceil((c.length / debit) * 1000)); });
              r.on("end", () => res.end());
              r.on("error", () => res.destroy());
            });
            amont.on("error", () => res.destroy());
            req.pipe(amont);
          }).listen(port, "127.0.0.1", () => console.log("mandataire lent prêt", port, debit));
          JS
          nohup node "${RUNNER_TEMP}/lent.mjs" 8899 40000 > "${RUNNER_TEMP}/lent.log" 2>&1 &
          sleep 1
          echo 'Acquire::http::Proxy "http://127.0.0.1:8899";' | sudo tee /etc/apt/apt.conf.d/99-banc
          nohup bash -c 'sleep 100; sudo rm -f /etc/apt/apt.conf.d/99-banc' >/dev/null 2>&1 &

      - name: Lancer l'étape réelle
        timeout-minutes: 25
        shell: bash
        run: |
          set -o pipefail
          debut=$(date +%s)
          bash -e "${RUNNER_TEMP}/installer.sh" 2>&1 | tee "${RUNNER_TEMP}/etape.log"
          echo "BANC étape réelle VERTE en $(( $(date +%s) - debut )) s"

      - name: Constats
        if: always()
        run: |
          echo "BANC essais lancés : $(grep -c 'Installing dependencies' "${RUNNER_TEMP}/etape.log" || true)"
          echo "BANC ce que chaque essai a dû télécharger :"; grep -E "Need to get|Fetched" "${RUNNER_TEMP}/etape.log" || echo "(rien)"
          grep -E "Could not get lock|dpkg was interrupted" "${RUNNER_TEMP}/etape.log" && echo "BANC verrou ou dpkg en défaut" || echo "BANC aucun verrou en défaut"
          ls -d "${HOME}"/.cache/ms-playwright/chromium-* || echo "BANC aucun Chromium installé"
          pgrep -a -x apt-get || echo "BANC aucun apt-get restant"
          pgrep -a -x dpkg || echo "BANC aucun dpkg restant"
