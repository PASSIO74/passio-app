name: banc-cc p-actuel-rsingle
on:
  pull_request:
    types: [opened, edited, labeled]
  pull_request_review_comment:
    types: [created, edited]
concurrency:
  group: banc-cc-p-actuel-rsingle-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  agent:
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'PASSIO74' &&
        (
          github.event.label.name == 'banc-label-ordre' ||
          contains(github.event.pull_request.body, 'ORDRE-BANC') ||
          contains(github.event.pull_request.title, 'ORDRE-BANC')
        )
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.comment.user.login == 'PASSIO74' &&
        github.event.pull_request.user.login == 'PASSIO74' &&
        contains(github.event.comment.body, 'ORDRE-BANC')
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'PASSIO74' &&
        github.event.pull_request.user.login == 'PASSIO74' &&
        contains(github.event.comment.body, 'ORDRE-BANC')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: sleep 30
