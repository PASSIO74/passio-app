name: banc-cc trace
on:
  pull_request:
    types: [opened, edited, labeled]
  pull_request_review_comment:
    types: [created, edited]
jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - env:
          ACTION: ${{ github.event.action }}
          EVENEMENT: ${{ github.event_name }}
          ETIQUETTE: ${{ github.event.label.name }}
          CHANGES: ${{ toJSON(github.event.changes) }}
          ACTUEL: ${{ ( github.event_name == 'pull_request' && github.event.pull_request.user.login == 'PASSIO74' && ( github.event.label.name == 'banc-label-ordre' || contains(github.event.pull_request.body, 'ORDRE-BANC') || contains(github.event.pull_request.title, 'ORDRE-BANC') ) ) || ( github.event_name == 'issue_comment' && github.event.comment.user.login == 'PASSIO74' && github.event.pull_request.user.login == 'PASSIO74' && contains(github.event.comment.body, 'ORDRE-BANC') ) || ( github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == 'PASSIO74' && github.event.pull_request.user.login == 'PASSIO74' && contains(github.event.comment.body, 'ORDRE-BANC') ) }}
          SERRE: ${{ ( github.event_name == 'pull_request' && github.event.pull_request.user.login == 'PASSIO74' && ( github.event.label.name == 'banc-label-ordre' || ( github.event.action == 'opened' && ( contains(github.event.pull_request.body, 'ORDRE-BANC') || contains(github.event.pull_request.title, 'ORDRE-BANC') ) ) || ( github.event.action == 'edited' && ( ( github.event.changes.body && contains(github.event.pull_request.body, 'ORDRE-BANC') && !contains(github.event.changes.body.from, 'ORDRE-BANC') ) || ( github.event.changes.title && contains(github.event.pull_request.title, 'ORDRE-BANC') && !contains(github.event.changes.title.from, 'ORDRE-BANC') ) ) ) ) ) || ( github.event_name == 'issue_comment' && github.event.comment.user.login == 'PASSIO74' && github.event.pull_request.user.login == 'PASSIO74' && contains(github.event.comment.body, 'ORDRE-BANC') && ( github.event.action == 'created' || ( github.event.changes.body && !contains(github.event.changes.body.from, 'ORDRE-BANC') ) ) ) || ( github.event_name == 'pull_request_review_comment' && github.event.comment.user.login == 'PASSIO74' && github.event.pull_request.user.login == 'PASSIO74' && contains(github.event.comment.body, 'ORDRE-BANC') && ( github.event.action == 'created' || ( github.event.changes.body && !contains(github.event.changes.body.from, 'ORDRE-BANC') ) ) ) }}
        run: |
          echo "TRACE evenement=${EVENEMENT} action=${ACTION} etiquette=${ETIQUETTE} actuel=${ACTUEL} serre=${SERRE}"
          echo "TRACE changes=$(printf '%s' "${CHANGES}" | tr -d '
 ')"
