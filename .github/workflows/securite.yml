name: Sécurité de la chaîne

# Audit de sécurité du 2026-11-06 (D-10). Aucun secret, droits en lecture. Chaque refus se résout ainsi :
#   · gate des workflows (`scripts/audit-workflows.js`) : corriger le workflow, épingler l'action par SHA ;
#   · `npm audit` du dashboard : monter le paquet en correctif ; le dashboard tient `service_role` ;
#   · gitleaks : vrai positif = RÉVOCATION du secret, jamais une simple suppression ; faux positif =
#     `.gitleaksignore`, empreinte et raison ;
#   · zizmor : corriger, ou exception en ligne justifiée. Non bloquant pour l'instant : à trier d'abord.
# Ce job n'est pas dans les contrôles requis de `main` : c'est au responsable de l'y ajouter.

on:
  pull_request:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles:
    name: Workflows et dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Gate des workflows
        run: node scripts/audit-workflows.js
      - name: Avis sur les dépendances du dashboard
        run: npm audit --audit-level=high --omit=dev --prefix dashboard

  secrets:
    name: Secrets dans le diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  statique:
    name: Analyse statique des workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
