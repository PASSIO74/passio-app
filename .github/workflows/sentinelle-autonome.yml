# ═══════════════════════════════════════════════════════════════════════════
# SENTINELLE AUTONOME — trouver un défaut de production et le faire corriger,
# sans PC allumé et sans geste humain.
#
# ─── POURQUOI CE WORKFLOW EXISTE ────────────────────────────────────────────
# La sentinelle du centre de pilotage fait déjà tout ça — mais elle vit sur la
# machine de Benjamin, qui doit être allumée, connectée, et le CLI authentifié.
# Ce workflow déplace la DÉTECTION dans GitHub, où rien de tout cela n'est
# nécessaire. Il ne remplace pas le pilotage : il le double là où il est fragile.
#
# ─── CE QU'IL FAIT, ET CE QU'IL NE FAIT PAS ─────────────────────────────────
# Il LIT la production (`client_errors`, erreurs JS et appels refusés de
# `telemetry_events`), classe les causes, et — quand une cause est réelle —
# OUVRE UNE ISSUE puis y pose le label `claude`. C'est tout. La réparation est
# faite par `claude-code.yml`, le canal déjà éprouvé du dépôt : on ne duplique
# pas une machinerie qui marche, on la déclenche.
#
# ⚠️ L'ISSUE EST CRÉÉE AVEC `SENTINELLE_TOKEN`, ET C'EST TOUT L'INTÉRÊT.
# Un événement produit par le `GITHUB_TOKEN` intégré NE DÉCLENCHE AUCUN
# workflow (règle GitHub anti-boucle). Une issue ouverte avec lui serait donc
# un cul-de-sac silencieux : elle existerait, et personne ne la traiterait
# jamais. Le jeton personnel agit au nom de PASSIO74 — ce que `claude-code.yml`
# exige explicitement (`github.event.issue.user.login == 'PASSIO74'`).
# Corollaire : tout ce qui ne doit PAS redéclencher Claude (commentaires,
# labels `humain`/`recidive`/`sentinelle-relancee`, issues [SENTINELLE MUETTE])
# est écrit avec `github.token` — et c'est aussi ce qui fait partir l'e-mail
# à Benjamin (GitHub ne notifie personne de ses propres gestes).
#
# ⚠️ LE LABEL `claude` EST POSÉ DANS UNE ÉTAPE SÉPARÉE, APRÈS L'ISSUE (A1).
# Mesuré du 10 au 12/09 : `gh issue create --label claude --label sentinelle`
# émettait TROIS événements dans la même seconde (opened, labeled claude,
# labeled sentinelle) vers le même groupe de concurrence de `claude-code.yml`,
# qui ne garde qu'UN run en attente. Une fois sur trois, l'évincé était le run
# `labeled claude` — le seul qui travaille — annulé en file (0 job, donc pas
# même le commentaire d'annulation). #316, #327, #337 : aucune PR, aucun
# commentaire, canal muet 6 h, 28 h 51 et 9 h. Un seul événement `labeled
# claude`, seul dans son groupe : plus de course.
#
# ⚠️ ET UN VEILLEUR RELIT LES ENQUÊTES OUVERTES (A2), parce qu'un run peut
# encore se perdre (quota, runner, annulation) et qu'une enquête ouverte sans
# personne dessus rend « une enquête à la fois » muet — 18 % du temps sur 10 j.
# Sans PR ni run après 20 min : relance UNE fois (label `claude` retiré puis
# reposé). Après 6 h sans correctif fusionné : label `humain` + bilan, et
# l'enquête sort du compte « une enquête à la fois » sans être fermée.
#
# ⚠️ « AUCUNE ERREUR » NE VEUT PAS DIRE « TOUT VA BIEN ». Ce canal ne voit que
# ce qui lève une erreur JavaScript ou un refus réseau. Bouton mort, résultat
# faux en HTTP 200, télémétrie interrompue : zéro ligne, et ça ressemble au
# calme. L'angle mort ne disparaît pas en changeant de machine. Et un run
# ROUGE du détecteur ouvre [SENTINELLE MUETTE] (label `disponibilite`) : le
# silence d'une sentinelle en panne ne doit jamais ressembler au calme.
#
# Fiche : docs/SENTINELLE_AUTONOME.md (la chaîne, ses façons de mourir, les labels).
# ═══════════════════════════════════════════════════════════════════════════
name: Sentinelle autonome

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sentinelle-autonome.yml"
      - "scripts/sentinelle-detecter.mjs"

concurrency:
  group: sentinelle-autonome
  cancel-in-progress: false

# `pull-requests: read` et `actions: read` : le veilleur et la dédup lisent les
# PR fusionnées et les runs de claude-code.yml / deploy.yml. Rien en écriture
# hors des issues.
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

jobs:
  detecter:
    name: Détecter un défaut de production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - name: Setup Node
        uses: actions/setup-node@v5
        with: { node-version: '22' }

      # Sur une PR qui modifie ce fichier, on ne fait QUE valider le détecteur :
      # jamais de lecture de production ni d'ouverture d'issue depuis une PR.
      - name: Verrous du détecteur
        run: node --test tests/unit/sentinelle-detecter.test.mjs

      # Registre structuré des résidus (cinquième contre-revue Astra, 2026-09-15,
      # mandat §9) : la Sentinelle MONTRE, à chaque passage, les résidus devenus
      # traitables et les écarts registre/dépôt, dans le résumé du run. Elle ne
      # les corrige pas et n'ouvre aucune issue pour eux (le canal d'enquête
      # reste réservé aux défauts subis par les utilisateurs) ; l'échec de la
      # gate est celui du job Audits de deploy.yml. Aucun secret, aucun réseau.
      - name: Résidus traitables (registre structuré)
        if: always()
        run: |
          node scripts/audit-registre-residus.js --json > /tmp/residus.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const r = JSON.parse(fs.readFileSync("/tmp/residus.json", "utf8"));
            const l = ["## Résidus (registre structuré)", ""];
            if (r.ok === false && r.erreurs) l.push("⚠️ registre invalide : " + r.erreurs.join(" ; "));
            else {
              l.push(r.total + " résidus, " + r.ouverts + " ouverts, " + r.traitables.length + " traitables, " + r.non_mesurables.length + " à condition manuelle");
              for (const x of r.lignes.filter((x) => x.traitable && x.statut !== "ferme")) l.push("- 🟠 " + x.id + " [" + x.gravite + "] " + x.titre + " — " + x.statut + " (" + x.condition.detail + ")");
              for (const e of r.ecarts) l.push("- ❌ " + e);
              if (!r.traitables.length && !r.ecarts.length) l.push("Aucun résidu traitable oublié.");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, l.map((x) => x + String.fromCharCode(10)).join(""));
          '

      - name: Mode PR — on s'arrête là
        if: github.event_name == 'pull_request'
        run: |
          echo "PR : seuls les verrous du détecteur sont joués." >> "${GITHUB_STEP_SUMMARY}"

      # ⚠️ COUPE-CIRCUIT, même convention que `sentinelle-distante.yml` : une
      # issue ouverte par PASSIO74 dont le titre contient [SENTINELLE PAUSE].
      # Un seul geste, depuis un téléphone, arrête tout le canal.
      # ⚠️ Liste par AUTEUR puis filtre LOCAL du titre, jamais `--search in:title` :
      # l'index de recherche de GitHub retarde de plusieurs heures (mesuré sur
      # #316), et une pause posée depuis un téléphone doit être vue AU RUN SUIVANT.
      - name: Coupe-circuit
        if: github.event_name != 'pull_request'
        id: pause
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --author PASSIO74 --limit 200 \
                --json title --jq '[.[] | select(.title | contains("[SENTINELLE PAUSE]"))] | length')"
          if [ "${n}" -gt 0 ]; then
            echo "actif=false" >> "${GITHUB_OUTPUT}"
            echo "## Sentinelle autonome : EN PAUSE" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "actif=true" >> "${GITHUB_OUTPUT}"
          fi

      # ⚠️ ON ÉCHOUE BRUYAMMENT SI LE JETON MANQUE OU A EXPIRÉ. Un jeton
      # personnel a une date de péremption ; sans ce contrôle, le jour où il
      # meurt, le canal rendrait « rien à signaler » pour toujours. C'est
      # exactement la panne silencieuse que ce chantier corrige.
      - name: Le jeton est-il vivant ?
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true'
        id: jeton
        env:
          GH_TOKEN: ${{ secrets.SENTINELLE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=SENTINELLE_TOKEN absent::Le secret n'est pas configuré : aucune issue ne peut être ouverte, donc aucun correctif ne partira. Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! gh api user --jq .login > /tmp/qui.txt 2>/tmp/err.txt; then
            echo "::error title=SENTINELLE_TOKEN invalide ou expiré::GitHub refuse ce jeton. Le canal est ARRÊTÉ tant qu'il n'est pas renouvelé (github.com/settings/tokens). Détail : $(head -c 300 /tmp/err.txt)"
            exit 1
          fi
          echo "Jeton valide, agit au nom de : $(cat /tmp/qui.txt)" >> "${GITHUB_STEP_SUMMARY}"

      # Les labels du canal existent AVANT qu'on en ait besoin : un `--add-label`
      # sur un label absent échoue, et l'échec tomberait au pire moment (une
      # escalade). `--force` rend l'étape idempotente. Voir le tableau des
      # labels dans docs/SENTINELLE_AUTONOME.md.
      - name: Labels du canal
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh label create sentinelle --repo "${GITHUB_REPOSITORY}" --color "B45309" --force \
            --description "Correctif né d'une alerte de production (canal automatique)" >/dev/null 2>&1 || true
          gh label create humain --repo "${GITHUB_REPOSITORY}" --color "5319E7" --force \
            --description "La machine s'arrête : une décision humaine est attendue" >/dev/null 2>&1 || true
          gh label create recidive --repo "${GITHUB_REPOSITORY}" --color "D93F0B" --force \
            --description "Défaut revenu après au moins deux correctifs déployés" >/dev/null 2>&1 || true
          gh label create sentinelle-relancee --repo "${GITHUB_REPOSITORY}" --color "FBCA04" --force \
            --description "Run Claude perdu, relancé une fois par le veilleur" >/dev/null 2>&1 || true
          gh label create disponibilite --repo "${GITHUB_REPOSITORY}" --color "B60205" --force \
            --description "Sonde de disponibilité du site servi" >/dev/null 2>&1 || true

      # ⚠️ VEILLEUR D'ENQUÊTE (A2). Pour chaque issue `sentinelle` OUVERTE non
      # remise à un humain :
      #   · aucune PR `claude/issue-<n>-*`, aucun run de claude-code.yml
      #     (issues) vivant ou réussi depuis sa création, âge > 20 min, jamais
      #     relancée → relance UNE fois : `claude` retiré (github.token, ne
      #     déclenche rien) puis reposé (SENTINELLE_TOKEN, déclenche), 8 s entre
      #     les deux pour que GitHub voie bien un événement `labeled` ;
      #   · âge > 6 h sans PR fusionnée → label `humain` + bilan (liens run/PR,
      #     raison lisible). PAS de fermeture : une fermeture sans correctif
      #     n'a pas de `deployeA`, la dédup la lirait par date et rouvrirait la
      #     même enquête au run suivant ; ouverte et `humain`, `choisirCible`
      #     la saute.
      # ⚠️ Les runs sont attribués par DATE (créés après l'issue) : `gh run
      # list` ne porte pas le numéro d'issue. Avec une seule enquête active à
      # la fois (garde ci-dessous), c'est suffisant ; un run humain `claude`
      # contemporain retarderait au pire une relance, jamais l'escalade à 6 h.
      - name: Veilleur d'enquête
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true'
        id: veilleur
        env:
          GH_TOKEN: ${{ github.token }}
          JETON_SENTINELLE: ${{ secrets.SENTINELLE_TOKEN }}
        run: |
          set -euo pipefail
          R="${GITHUB_REPOSITORY}"
          maintenant="$(date -u +%s)"
          run_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}"
          gh issue list --repo "${R}" --state open --label sentinelle --limit 50 \
            --json number,createdAt,labels,url > /tmp/enquetes.json
          gh pr list --repo "${R}" --state all --limit 200 \
            --json number,headRefName,state,url > /tmp/prs.json
          gh run list --repo "${R}" --workflow claude-code.yml --event issues --limit 50 \
            --json status,conclusion,createdAt,url > /tmp/runs-claude.json
          relances=0; escalades=0; suivies=0
          for n in $(jq -r '.[].number' /tmp/enquetes.json); do
            labels="$(jq -r --argjson n "${n}" '[.[] | select(.number == $n) | .labels[].name] | join(",")' /tmp/enquetes.json)"
            case ",${labels}," in *",humain,"*) continue ;; esac
            suivies=$((suivies + 1))
            creee="$(jq -r --argjson n "${n}" '.[] | select(.number == $n) | .createdAt' /tmp/enquetes.json)"
            age=$(( maintenant - $(date -u -d "${creee}" +%s) ))
            fusionnees="$(jq -r --arg p "claude/issue-${n}-" '[.[] | select(.headRefName | startswith($p)) | select(.state == "MERGED")] | length' /tmp/prs.json)"
            [ "${fusionnees}" -eq 0 ] || continue
            prs="$(jq -r --arg p "claude/issue-${n}-" '[.[] | select(.headRefName | startswith($p))] | length' /tmp/prs.json)"
            liens_pr="$(jq -r --arg p "claude/issue-${n}-" '[.[] | select(.headRefName | startswith($p)) | "- PR " + .url + " (" + .state + ")"] | join("\n")' /tmp/prs.json)"
            runs="$(jq -r --arg c "${creee}" '[.[] | select(.createdAt >= $c) | select(.status == "in_progress" or .status == "queued" or .conclusion == "success")] | length' /tmp/runs-claude.json)"
            liens_run="$(jq -r --arg c "${creee}" '[.[] | select(.createdAt >= $c) | "- run " + .url + " (" + (.conclusion // .status) + ")"] | join("\n")' /tmp/runs-claude.json)"
            relancee=non
            case ",${labels}," in *",sentinelle-relancee,"*) relancee=oui ;; esac
            if [ "${age}" -gt 21600 ]; then
              if [ "${prs}" -gt 0 ]; then raison="une PR existe mais n'est pas fusionnée (CI rouge, gouvernance rouge ou auto-fusion non armée)"
              elif [ "${relancee}" = "oui" ]; then raison="relancée une fois, toujours aucune PR"
              elif [ "${runs}" -gt 0 ]; then raison="un run Claude a tourné sans produire de PR fusionnée (échec, périmètre, ou cause non établie)"
              else raison="aucun run ni PR"
              fi
              {
                echo "### Enquête remise à un humain"
                echo
                echo "Ouverte depuis $(( age / 3600 )) h sans correctif fusionné : ${raison}."
                echo
                echo "Elle ne compte plus dans « une enquête à la fois » (label \`humain\`) : le canal continue sur les autres défauts. Elle n'est PAS fermée — fermer sans correctif rouvrirait la même enquête au run suivant. Geste : lire les liens, décider (correctif à la main, ou fermeture motivée)."
                echo
                if [ -n "${liens_pr}" ]; then echo "${liens_pr}"; fi
                if [ -n "${liens_run}" ]; then echo "${liens_run}"; fi
                echo "- Veilleur : ${run_url}"
              } > /tmp/bilan.md
              gh issue comment "${n}" --repo "${R}" --body-file /tmp/bilan.md >/dev/null
              gh issue edit "${n}" --repo "${R}" --add-label humain >/dev/null
              escalades=$((escalades + 1))
            elif [ "${age}" -gt 1200 ] && [ "${prs}" -eq 0 ] && [ "${runs}" -eq 0 ] && [ "${relancee}" = "non" ]; then
              gh issue edit "${n}" --repo "${R}" --remove-label claude >/dev/null 2>&1 || true
              sleep 8
              GH_TOKEN="${JETON_SENTINELLE}" gh issue edit "${n}" --repo "${R}" --add-label claude >/dev/null
              gh issue edit "${n}" --repo "${R}" --add-label sentinelle-relancee >/dev/null
              {
                echo "### Run perdu, relancé"
                echo
                echo "Aucun run de \`claude-code.yml\` n'a traité cette enquête depuis sa création ($(( age / 60 )) min) : le label \`claude\` a été retiré puis reposé pour déclencher un nouveau run. Une seule relance : si elle se perd aussi, l'enquête sera remise à un humain au bout de 6 h."
                echo
                echo "- Veilleur : ${run_url}"
              } > /tmp/relance.md
              gh issue comment "${n}" --repo "${R}" --body-file /tmp/relance.md >/dev/null
              relances=$((relances + 1))
            fi
          done
          echo "## Veilleur : ${suivies} enquête(s) suivie(s), ${relances} relancée(s), ${escalades} remise(s) à un humain" >> "${GITHUB_STEP_SUMMARY}"

      # Une seule enquête à la fois. Tant qu'une issue de la sentinelle est
      # ouverte ET encore confiée à la machine, on n'en empile pas une deuxième :
      # le canal Claude travaille déjà, et deux corrections concurrentes sur le
      # même dépôt se marchent dessus (incident du 2026-07-21, trois commits
      # mêlant deux travaux). Les issues `humain` (escalade, récidive) ne
      # bloquent plus rien : c'est ce qui empêche une enquête abandonnée de
      # rendre le canal muet jusqu'à un clic.
      # ⚠️ Par LABEL, jamais par `--search in:title` (index en retard, voir dédup).
      - name: Une enquête à la fois
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true'
        id: encours
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label sentinelle --limit 100 \
                --json labels --jq '[.[] | select([.labels[].name] | index("humain") | not)] | length')"
          h="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --label sentinelle --label humain --limit 100 \
                --json number --jq 'length')"
          echo "libre=$([ "${n}" -eq 0 ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"
          [ "${n}" -eq 0 ] || echo "Une enquête est déjà confiée à la machine : on n'en démarre pas d'autre." >> "${GITHUB_STEP_SUMMARY}"
          [ "${h}" -eq 0 ] || echo "${h} enquête(s) attendent une décision humaine (label \`humain\`)." >> "${GITHUB_STEP_SUMMARY}"

      - name: Lire la production
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true' && steps.encours.outputs.libre == 'true'
        id: detect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://njkiyoklssvefstljemx.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENTINELLE_FENETRE_H: "24"
        run: |
          set -euo pipefail
          node scripts/sentinelle-detecter.mjs > /tmp/verdict.json
          # Le résumé ne porte pas les 200 occurrences par candidat (jusqu'à
          # plusieurs centaines de Ko) : le verdict complet reste dans /tmp.
          node -e "
            const v = JSON.parse(require('fs').readFileSync('/tmp/verdict.json', 'utf8'));
            for (const c of [v.cible, ...(v.candidats || [])]) if (c) delete c.occurrences;
            process.stdout.write('## Verdict\n\n\`\`\`json\n' + JSON.stringify(v, null, 2) + '\n\`\`\`\n');
          " >> "${GITHUB_STEP_SUMMARY}"
          cible="$(node -e "const v=require('/tmp/verdict.json');process.stdout.write(v.cible?'oui':'non')")"
          echo "cible=${cible}" >> "${GITHUB_OUTPUT}"

      # ⚠️ NE PAS ROUVRIR UNE ENQUÊTE SUR UN DÉFAUT DÉJÀ CORRIGÉ.
      # Vécu les 2026-09-09/10 : #312 corrigée par la PR #313, déployée à 23h47,
      # fermée à 04h43 — et rouverte à l'identique à 06h05 (#316), parce que la
      # fenêtre de 24 h portait encore les occurrences d'AVANT le correctif.
      # Vécu le 2026-09-12 : #355 a rouvert #350 sur UNE occurrence 41 min
      # après la fusion, venue d'un client encore sur l'ancien build (PWA).
      # ⚠️ LA DÉDUP EST DONC DATÉE SUR LE DÉPLOIEMENT ET LA VERSION DU CLIENT
      # (A3) : pour chaque enquête fermée dont le titre est celui d'un candidat,
      # on retrouve la PR fusionnée `claude/issue-<n>-*`, le run deploy.yml vert
      # de son commit (`deployeA`) et les builds qui CONTIENNENT le correctif
      # (`versions` : sha8 du commit + commits de main postérieurs). `estVivante`
      # tranche ; sans PR ni déploiement retrouvé, la règle historique par date
      # de fermeture s'applique telle quelle.
      # ⚠️ Filtrage par LABEL, jamais par `--search "…" in:title` : l'index de
      # recherche de GitHub retarde (mesuré : #316 en était absente des heures
      # après sa création), et une dédup bâtie sur un index en retard laisse
      # passer très exactement le doublon qu'elle devait arrêter.
      # ⚠️ ON AVANCE DANS LES CANDIDATS (ASTRA-08) et on SAUTE les titres encore
      # ouverts (dont `humain`) ; ≥ 2 correctifs déployés sur le même titre =
      # RÉCIDIVE → issue `humain` sans `claude` (A4).
      - name: Ce défaut a-t-il déjà été corrigé ?
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true' && steps.encours.outputs.libre == 'true' && steps.detect.outputs.cible == 'oui'
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="${GITHUB_REPOSITORY}"
          gh issue list --repo "${R}" --state closed --label sentinelle --limit 100 \
            --json number,title,closedAt,url > /tmp/fermees.json
          gh issue list --repo "${R}" --state open --label sentinelle --limit 100 \
            --json number,title > /tmp/ouvertes.json
          gh pr list --repo "${R}" --state merged --limit 200 \
            --json number,headRefName,mergeCommit,mergedAt > /tmp/prs-fusionnees.json
          node --input-type=module -e '
            import fs from "node:fs";
            import { execFileSync } from "node:child_process";
            const { titreIssue, choisirCible, escaladeRecidive } = await import("./scripts/sentinelle-detecter.mjs");
            const R = process.env.GITHUB_REPOSITORY;
            const v = JSON.parse(fs.readFileSync("/tmp/verdict.json", "utf8"));
            const fermees = JSON.parse(fs.readFileSync("/tmp/fermees.json", "utf8"));
            const ouvertes = JSON.parse(fs.readFileSync("/tmp/ouvertes.json", "utf8"));
            const prs = JSON.parse(fs.readFileSync("/tmp/prs-fusionnees.json", "utf8"));
            const liste = Array.isArray(v.candidats) && v.candidats.length ? v.candidats : [v.cible].filter(Boolean);
            const titres = new Set(liste.map(titreIssue));
            // Arguments en tableau, jamais un shell : les SHA sont validés avant usage.
            const gh = (args) => execFileSync("gh", args, { encoding: "utf8" });
            const SHA = /^[0-9a-f]{40}$/;
            const sha8 = (s) => String(s).slice(0, 8);
            let enrichies = 0;
            for (const f of fermees) {
              if (!titres.has(String(f.title || ""))) continue;
              const pr = prs.find((p) => String(p.headRefName || "").startsWith("claude/issue-" + f.number + "-"));
              const sha = pr && pr.mergeCommit && SHA.test(String(pr.mergeCommit.oid || "")) ? pr.mergeCommit.oid : null;
              if (!sha) continue;
              f.sha = sha;
              let runs = [];
              try { runs = JSON.parse(gh(["run", "list", "--repo", R, "--workflow", "deploy.yml", "--commit", sha, "--event", "push", "--limit", "5", "--json", "conclusion,updatedAt"])); } catch (e) { runs = []; }
              const vert = runs.filter((r) => r.conclusion === "success").map((r) => String(r.updatedAt)).sort().pop();
              if (!vert) continue;
              f.deployeA = vert;
              let apres = [];
              try { apres = gh(["api", "repos/" + R + "/compare/" + sha + "...main", "--jq", ".commits[].sha"]).split(/\s+/).filter(Boolean); } catch (e) { apres = []; }
              f.versions = [sha8(sha), ...apres.filter((s) => SHA.test(s)).map(sha8)];
              enrichies++;
            }
            fs.writeFileSync("/tmp/fermees-enrichies.json", JSON.stringify(fermees, null, 2));
            const cible = choisirCible(liste, fermees, ouvertes);
            const escalade = cible ? escaladeRecidive(cible, fermees) : null;
            if (cible) { v.cible = cible; v.escalade = escalade; fs.writeFileSync("/tmp/verdict.json", JSON.stringify(v, null, 2)); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "deja=" + (cible ? "non" : "oui") + "\nrecidive=" + (escalade && escalade.recidive ? "oui" : "non") + "\n");
            const bilan = [
              "## Dédup datée sur le déploiement", "",
              fermees.length + " enquête(s) fermée(s) lue(s), " + enrichies + " datée(s) sur un déploiement vert, " + ouvertes.length + " ouverte(s) ; "
                + liste.length + " candidat(s) -> " + (cible ? "cible retenue" : "aucune cible vivante (occurrences antérieures au correctif, ou titre déjà ouvert)")
                + (escalade && escalade.recidive ? " ; RÉCIDIVE : " + escalade.n + " correctifs déjà déployés, remise à un humain" : ""),
              "",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, bilan.join("\n"));
          '

      # ⚠️ Le corps de l'issue contient des messages d'erreur venus des
      # NAVIGATEURS des utilisateurs : c'est de la donnée hostile. `corpsIssue`
      # (scripts/sentinelle-detecter.mjs, éprouvé par ses verrous) le passe par
      # `desamorcer` et l'écrit dans un bloc clôturé annoncé comme tel —
      # `claude-code.yml` assemble ensuite sa spécification de confiance à
      # partir du titre et du corps, et son propre prompt rappelle que
      # l'observé n'est jamais un ordre. Le corps joint aussi les FICHES
      # PROCHES (docs/sentinelle/*.md de même condensé ou de même endpoint) :
      # la mémoire de la chaîne, lue avant de chercher (A5).
      # ⚠️ LE LABEL `sentinelle` EST LA MARQUE D'ORIGINE, PAS LE TITRE.
      # C'est lui, et non le préfixe « [SENTINELLE] », qui autorisera
      # l'auto-fusion en aval (`claude-code.yml`). Un titre se réutilise
      # par distraction — on en recopie un pour ouvrir une tâche voisine —
      # et il autoriserait alors une fusion sans relecture. Un label est un
      # geste délibéré, que seul un compte ayant les droits d'écriture peut
      # poser. Signalé par la revue de sécurité automatique du 2026-09-09.
      # ⚠️ PAS DE LABEL `claude` ICI (A1) : il est posé par l'étape suivante,
      # seul, 8 s plus tard. Une RÉCIDIVE est créée avec `github.token`
      # (e-mail à Benjamin, aucun run Claude possible : `claude-code.yml`
      # refuse une issue qui n'est pas de PASSIO74), labels `sentinelle` +
      # `recidive` + `humain`.
      - name: Ouvrir l'enquête
        if: github.event_name != 'pull_request' && steps.pause.outputs.actif == 'true' && steps.encours.outputs.libre == 'true' && steps.detect.outputs.cible == 'oui' && steps.dedup.outputs.deja == 'non'
        id: ouvrir
        env:
          GH_TOKEN: ${{ secrets.SENTINELLE_TOKEN }}
          JETON_INTEGRE: ${{ github.token }}
          RECIDIVE: ${{ steps.dedup.outputs.recidive }}
        run: |
          set -euo pipefail
          R="${GITHUB_REPOSITORY}"
          # ⚠️ ESM, comme le module : `require()` d'un `.mjs` dépend de la version
          # exacte de Node et casserait le canal en silence le jour d'une mise à
          # jour du runner. Le titre et le corps viennent du module, jamais d'une
          # seconde copie.
          node --input-type=module -e '
            import fs from "node:fs";
            const { titreIssue, corpsIssue, fichesProches, lireFiches } = await import("./scripts/sentinelle-detecter.mjs");
            const v = JSON.parse(fs.readFileSync("/tmp/verdict.json", "utf8"));
            const c = v.cible;
            const proches = fichesProches(c, await lireFiches("docs/sentinelle"));
            const recidive = process.env.RECIDIVE === "oui" && v.escalade && v.escalade.recidive ? v.escalade : null;
            fs.writeFileSync("/tmp/issue.md", corpsIssue(v, c, { fichesProches: proches, recidive }));
            fs.writeFileSync("/tmp/titre.txt", titreIssue(c));
            fs.writeFileSync("/tmp/mode.txt", recidive ? "recidive" : "enquete");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Fiches proches jointes : " + proches.length + "\n");
          '
          mode="$(cat /tmp/mode.txt)"
          if [ "${mode}" = "recidive" ]; then
            numero="$(GH_TOKEN="${JETON_INTEGRE}" gh issue create --repo "${R}" \
              --title "$(cat /tmp/titre.txt)" --body-file /tmp/issue.md \
              --label sentinelle --label recidive --label humain | grep -oE '[0-9]+$')"
            echo "Récidive remise à un humain : #${numero} (sans label claude)" >> "${GITHUB_STEP_SUMMARY}"
          else
            numero="$(gh issue create --repo "${R}" \
              --title "$(cat /tmp/titre.txt)" --body-file /tmp/issue.md \
              --label sentinelle | grep -oE '[0-9]+$')"
            echo "Enquête ouverte : #${numero}" >> "${GITHUB_STEP_SUMMARY}"
          fi
          echo "numero=${numero}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      # ⚠️ UN SEUL ÉVÉNEMENT `labeled claude`, SEUL DANS SON GROUPE (A1). Les
      # événements `opened` et `labeled sentinelle` de l'étape précédente sont
      # déjà passés (et écartés par le `if:` de claude-code.yml) quand celui-ci
      # arrive : plus rien à évincer dans la file. Le jeton est SENTINELLE_TOKEN,
      # le seul dont les événements déclenchent un workflow.
      - name: Déclencher le canal Claude
        if: github.event_name != 'pull_request' && steps.ouvrir.outputs.mode == 'enquete'
        id: declencher
        env:
          GH_TOKEN: ${{ secrets.SENTINELLE_TOKEN }}
          NUMERO: ${{ steps.ouvrir.outputs.numero }}
        run: |
          set -euo pipefail
          case "${NUMERO}" in
            ''|*[!0-9]*)
              echo "::error title=Numéro d'issue invalide::Reçu « ${NUMERO} », attendu un entier : le label claude n'est pas posé."
              exit 1 ;;
          esac
          sleep 8
          gh issue edit "${NUMERO}" --repo "${GITHUB_REPOSITORY}" --add-label claude >/dev/null
          echo "Label claude posé sur #${NUMERO} : le canal Claude est déclenché." >> "${GITHUB_STEP_SUMMARY}"

      - name: Rien à signaler
        if: github.event_name != 'pull_request' && steps.detect.outputs.cible == 'non'
        run: |
          {
            echo "## Aucune cause retenue"
            echo ""
            echo "⚠️ Cela ne veut PAS dire que tout va bien : ce canal ne voit que ce qui lève"
            echo "une erreur JavaScript ou un refus réseau. Un bouton mort, un résultat faux en"
            echo "HTTP 200 ou une télémétrie interrompue ne produisent aucune ligne — et ressemblent au calme."
          } >> "${GITHUB_STEP_SUMMARY}"

      # ⚠️ [SENTINELLE MUETTE] (A8). Un run rouge du détecteur (Supabase en 5xx,
      # jeton mort, script cassé) n'envoyait qu'un e-mail d'échec de run, que
      # rien ne distingue des autres. Même patron que disponibilite.yml : UNE
      # issue label `disponibilite` (jamais `claude` — personne ne répare un
      # détecteur par une PR automatique), créée avec `github.token` (e-mail à
      # Benjamin), actualisée tant que ça dure, refermée au run vert suivant.
      # Les issues de ce workflow lui-même en PR mode ne sont pas concernées.
      - name: Sentinelle muette (le détecteur a échoué)
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ETAPES: "pause=${{ steps.pause.outcome }} jeton=${{ steps.jeton.outcome }} veilleur=${{ steps.veilleur.outcome }} encours=${{ steps.encours.outcome }} detect=${{ steps.detect.outcome }} dedup=${{ steps.dedup.outcome }} ouvrir=${{ steps.ouvrir.outcome }} declencher=${{ steps.declencher.outcome }}"
        run: |
          set -u
          R="${GITHUB_REPOSITORY}"
          run_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}"
          etape="$(printf '%s\n' ${ETAPES} | grep '=failure$' | cut -d= -f1 | head -1)"
          etape="${etape:-inconnue}"
          titre="[SENTINELLE MUETTE] le détecteur a échoué : ${etape}"
          existante="$(gh issue list --repo "${R}" --state open --label disponibilite --limit 50 \
                        --json number,title --jq '[.[] | select(.title | startswith("[SENTINELLE MUETTE]"))] | .[0].number // empty')"
          {
            echo "Le détecteur de la sentinelle autonome a échoué à l'étape **${etape}** : tant que ça dure, aucun défaut de production n'est relevé par ce canal, et son silence ressemble au calme."
            echo
            echo "- Run : ${run_url}"
            echo "- Étapes : \`${ETAPES}\`"
            echo "- À regarder : la marche rouge du run (jeton SENTINELLE_TOKEN expiré ? clé service_role changée ? Supabase en 5xx ? verrous rouges ?)."
            echo
            echo "Cette issue se referme d'elle-même au prochain run vert. Label \`disponibilite\` : elle ne déclenche aucune correction automatique."
          } > /tmp/muette.md
          if [ -n "${existante}" ]; then
            gh issue comment "${existante}" --repo "${R}" --body-file /tmp/muette.md
          else
            gh issue create --repo "${R}" --title "${titre}" --label disponibilite --body-file /tmp/muette.md
          fi

      - name: Sentinelle de nouveau vivante (refermer l'alerte)
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          R="${GITHUB_REPOSITORY}"
          run_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}"
          for n in $(gh issue list --repo "${R}" --state open --label disponibilite --limit 50 \
                       --json number,title --jq '.[] | select(.title | startswith("[SENTINELLE MUETTE]")) | .number'); do
            gh issue comment "${n}" --repo "${R}" --body "✅ Le détecteur a de nouveau rendu un verdict — ${run_url}"
            gh issue close "${n}" --repo "${R}" --reason completed
          done
