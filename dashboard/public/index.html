<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>Passio — Centre de pilotage</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='gA' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23ddd6fe'/><stop offset='1' stop-color='%23a78bfa'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23gA)'/><path d='M24 24 L76 24 L24 76' stroke='%23ffffff' stroke-width='13' stroke-linecap='round' stroke-linejoin='round' fill='none'/><path d='M76 24 L76 76' stroke='%234c1d95' stroke-width='13' stroke-linecap='round' fill='none'/></svg>" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <a href="#view" class="skip-link" id="skipLink">Aller au contenu</a>
  <div id="loginScreen" class="login-screen" hidden>
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 100 100" width="52" height="52"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd6fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#lg)"/><path d="M24 24 L76 24 L24 76" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M76 24 L76 76" stroke="#4c1d95" stroke-width="13" stroke-linecap="round" fill="none"/></svg>
      </div>
      <h1>Centre de pilotage</h1>
      <p class="login-sub">Supervision temps réel de Passio</p>
      <label class="field"><span>Identifiant</span><input id="loginUser" name="username" autocomplete="username" required /></label>
      <label class="field"><span>Mot de passe</span><input id="loginPass" name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      <p id="loginError" class="login-error" role="alert" aria-live="assertive"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg viewBox="0 0 100 100" width="32" height="32" aria-hidden="true"><defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddd6fe"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="100" height="100" rx="22" fill="url(#bg2)"/><path d="M24 24 L76 24 L24 76" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M76 24 L76 76" stroke="#4c1d95" stroke-width="13" stroke-linecap="round" fill="none"/></svg>
        <div><strong>Passio</strong><span>Control Center</span></div>
      </div>
      <nav id="nav" class="nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-foot">
        <div id="sseStatus" class="sse-status" title="Connexion temps réel"><span class="dot"></span><span class="sse-label">hors ligne</span></div>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Menu">&#9776;</button>
        <div class="topbar-title" id="topbarTitle">Vue d'ensemble</div>
        <div class="global-search">
          <input id="globalSearch" type="search" placeholder="Rechercher un événement, un utilisateur, un endpoint…" aria-label="Recherche globale" />
          <button id="globalSearchBtn" class="global-search-btn" type="button" aria-label="Rechercher" title="Rechercher">Rechercher</button>
        </div>
        <div class="topbar-right">
          <a class="btn btn-sm" href="/command.html" title="Poste de commande — risques et actions">Command</a>
          <a class="btn btn-sm" href="/mobile.html" title="Pilot mobile — supervision et tests autorisés">Pilot</a>
          <span id="envBadge" class="env-badge">—</span>
          <button class="icon-btn" id="notifBtn" aria-label="Notifications — tout ce qui se passe" title="Notifications — tout ce qui se passe"><span id="notifCount" class="badge-count" hidden>0</span></button>
          <button class="icon-btn" id="themeBtn" aria-label="Thème clair/sombre" title="Thème"></button>
          <button class="icon-btn" id="fullscreenBtn" aria-label="Plein écran" title="Plein écran (supervision)"></button>
          <div class="user-chip" id="userChip"><span id="userName">—</span><small id="userRole"></small></div>
          <button class="icon-btn" id="logoutBtn" aria-label="Se déconnecter" title="Se déconnecter"></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <div id="drawer" class="drawer" hidden aria-label="Détails">
      <div class="drawer-head"><strong id="drawerTitle">Détails</strong><button class="icon-btn" id="drawerClose" aria-label="Fermer">&times;</button></div>
      <div id="drawerBody" class="drawer-body"></div>
    </div>
    <div id="drawerScrim" class="drawer-scrim" hidden></div>

    <div id="notifScrim" class="drawer-scrim" hidden></div>
    <div id="notifPanel" class="alerts-panel notif-panel" hidden aria-label="Notifications">
      <div class="drawer-head">
        <strong>Notifications</strong>
        <div class="notif-head-actions">
          <button class="btn btn-sm" id="notifClear">Tout effacer</button>
          <button class="icon-btn" id="notifClose" aria-label="Fermer">&times;</button>
        </div>
      </div>
      <div class="notif-sub">Tout ce qui se passe en direct. Clique une ligne pour ouvrir la page concernée.</div>
      <div id="notifList" class="notif-list"></div>
    </div>

    <div id="toast" class="toast" hidden></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
