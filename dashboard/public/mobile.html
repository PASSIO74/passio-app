<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0912" />
  <meta name="robots" content="noindex" />
  <!-- RETIRÉ le 2026-10-23 : le pilote mobile du PC (même Wi-Fi obligatoire,
       PC allumé obligatoire) doublait le pilotage en ligne. Il n'en reste que
       ce renvoi, pour les icônes déjà posées sur un écran d'accueil. -->
  <meta http-equiv="refresh" content="2;url=https://passio-app.netlify.app/pilotage/" />
  <title>PASSIO Pilotage — déménagé</title>
  <link rel="icon" type="image/svg+xml" href="icons/pilot.svg" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0912; color: #f6f3fb;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; display: grid; gap: 14px; }
    h1 { font-size: 22px; margin: 0; }
    p { margin: 0; color: #a69cb8; }
    a.btn { display: block; text-align: center; padding: 14px 16px; border-radius: 12px; background: #7c3aed; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="icons/pilot-192.png" alt="" width="72" height="72" />
    <h1>Le pilotage a déménagé</h1>
    <p>Il est maintenant en ligne : il marche partout, sans PC allumé et sans être sur le même Wi-Fi.</p>
    <a id="nouveauPilotage" class="btn" href="https://passio-app.netlify.app/pilotage/">Ouvrir le pilotage</a>
    <p>Pense à l'ajouter de nouveau à ton écran d'accueil depuis cette nouvelle adresse, puis à supprimer l'ancienne icône.</p>
  </main>
</body>
</html>
