[build]
  publish = "dist"
  # Edge Function du cache CDN des médias (/media/*) — voir docs/CDN_MEDIAS.md
  edge_functions = "netlify/edge-functions"

# Le CACHE se règle dans `_headers`, et là seulement (audit des routes, 2026-11-15).
# Mesuré en production : pour un même chemin, la règle de ce fichier l'EMPORTE sur
# celle de `_headers` — `/sw.js` et `/manifest.json` étaient servis `no-cache`
# alors que `_headers` (et son banc) les déclaraient `no-store`. Verrou :
# tests/unit/entetes-coherence.test.mjs ⑤.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://njkiyoklssvefstljemx.supabase.co wss://njkiyoklssvefstljemx.supabase.co https://fcksxofaelcdmmifnwjo.supabase.co wss://fcksxofaelcdmmifnwjo.supabase.co https://tiles.openfreemap.org https://api-adresse.data.gouv.fr https://photon.komoot.io https://api.klipy.com https://api.giphy.com stun:stun.l.google.com:19302 stun:stun1.l.google.com:19302 stun:stun2.l.google.com:19302 stun:stun.cloudflare.com:3478 turn:turn.cloudflare.com:3478 turn:turn.cloudflare.com:80 turns:turn.cloudflare.com:5349 turns:turn.cloudflare.com:443; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
